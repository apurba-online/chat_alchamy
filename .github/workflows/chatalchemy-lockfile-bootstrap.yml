name: ChatAlchemy Lockfile Bootstrap

on:
  push:
    branches:
      - agent/chatalchemy-production-ready
    paths:
      - .github/workflows/chatalchemy-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatalchemy-production-ready
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact npm dependency lock
        working-directory: ChatAlchemy
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- ChatAlchemy/package-lock.json && git ls-files --error-unmatch ChatAlchemy/package-lock.json >/dev/null 2>&1; then
            echo "Frontend lockfile is already committed and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatAlchemy/package-lock.json
          git commit -m "Pin frontend dependency lock"
          git push origin HEAD:agent/chatalchemy-production-ready
