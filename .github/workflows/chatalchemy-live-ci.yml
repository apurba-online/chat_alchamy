name: ChatAlchemy-Live CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and mocked integration tests
        run: PYTHONPATH=. pytest -m 'not live' -q
      - name: Generate publication benchmark
        run: PYTHONPATH=. python scripts/generate_livebiobench.py --n 1500 --seed 1729 --out benchmark/livebiobench-ci.json
      - name: Validate benchmark cardinality
        run: |
          python - <<'PY'
          import json
          data = json.load(open('benchmark/livebiobench-ci.json'))
          assert len(data) == 1500
          assert len({item['id'] for item in data}) == 1500
          print('LiveBioEvidenceBench generation passed')
          PY

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Strict TypeScript check
        run: npm run typecheck
      - run: npm run build

  live-contracts:
    needs: [backend-unit, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Live API contract tests
        run: PYTHONPATH=. pytest -m live -q
      - name: Independent live benchmark smoke
        run: PYTHONPATH=. python scripts/run_live_benchmark.py --n 8 --seed 1729 --out benchmark/live-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatalchemy-live-smoke
          path: ChatAlchemy/backend/benchmark/live-smoke.json
          if-no-files-found: ignore
