name: ChatAlchemy-Live CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -m 'not live' -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ChatAlchemy/package-lock.json
      - run: npm ci
      - run: npm run build

  live-contracts:
    needs: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Live API contract tests
        run: PYTHONPATH=. pytest -m live -q
      - name: Live end-to-end benchmark
        run: PYTHONPATH=. python scripts/run_live_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatalchemy-live-benchmark
          path: ChatAlchemy/backend/live_benchmark_results.json
          if-no-files-found: ignore
