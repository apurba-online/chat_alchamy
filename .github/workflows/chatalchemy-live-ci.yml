name: ChatAlchemy-Live CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and mocked integration tests
        run: PYTHONPATH=. pytest -m 'not live' -q
      - name: Publication artifact gate
        run: PYTHONPATH=. python scripts/validate_publication_artifact.py
      - name: Generate frozen publication benchmark
        run: PYTHONPATH=. python scripts/generate_livebiobench.py --n 1500 --seed 1729 --out benchmark/livebiobench-ci.json --manifest benchmark/livebiobench-ci.manifest.json
      - name: Validate benchmark protocol manifest
        run: |
          python - <<'PY'
          import json
          cases = json.load(open('benchmark/livebiobench-ci.json'))
          manifest = json.load(open('benchmark/livebiobench-ci.manifest.json'))
          assert len(cases) == 1500
          assert len({item['id'] for item in cases}) == 1500
          assert len({item['task_signature'] for item in cases}) == 1500
          assert manifest['case_count'] == 1500
          assert manifest['task_signature_count'] == 1500
          assert manifest['split_counts'] == {'dev': 300, 'test': 900, 'stress': 300}
          assert manifest['fingerprint_sha256']
          assert manifest['schema'].startswith('LiveBioEvidenceBench-v2')
          print('LiveBioEvidenceBench protocol gate passed:', manifest['fingerprint_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: livebiobench-protocol
          path: |
            ChatAlchemy/backend/benchmark/livebiobench-ci.json
            ChatAlchemy/backend/benchmark/livebiobench-ci.manifest.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Strict TypeScript check
        run: npm run typecheck
      - run: npm run build

  live-contracts:
    needs: [backend-unit, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Live API contract tests
        run: PYTHONPATH=. pytest -m live -q
      - name: Independent live benchmark smoke on frozen IDs
        run: PYTHONPATH=. python scripts/run_live_benchmark.py --limit 8 --seed 1729 --out benchmark/live-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatalchemy-live-smoke
          path: ChatAlchemy/backend/benchmark/live-smoke.json
          if-no-files-found: ignore

  model-credential-smoke:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Detect repository model secret without printing it
        id: credential
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY repository secret is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY repository secret is not configured."
          fi
      - name: Probe project model access
        id: access
        if: ${{ steps.credential.outputs.available == 'true' }}
        continue-on-error: true
        run: PYTHONPATH=. python scripts/check_openai_access.py --out benchmark/openai-access-probe.json
      - name: Select first accessible research model
        id: selected
        if: ${{ steps.credential.outputs.available == 'true' && steps.access.outcome == 'success' }}
        shell: bash
        run: |
          MODEL=$(python - <<'PY'
          import json
          payload = json.load(open('benchmark/openai-access-probe.json'))
          models = payload.get('successful_models') or []
          if not models:
              raise SystemExit(2)
          print(models[0])
          PY
          )
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected accessible model: $MODEL"
      - name: One-case structured baseline smoke
        if: ${{ steps.selected.outputs.model != '' }}
        run: >-
          PYTHONPATH=. python scripts/run_model_baseline.py
          --mode llm_only
          --model '${{ steps.selected.outputs.model }}'
          --seed 1729
          --split dev
          --limit 1
          --out benchmark/model-credential-smoke.json
      - name: Assert model baseline produced a valid prediction
        if: ${{ steps.selected.outputs.model != '' }}
        run: |
          python - <<'PY'
          import json
          payload = json.load(open('benchmark/model-credential-smoke.json'))
          summary = payload['summary']
          assert summary['model_error_rate'] == 0, summary
          assert summary['baseline_mean_task_score'] is not None, summary
          print('Structured model baseline preflight passed.')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ steps.credential.outputs.available == 'true' && always() }}
        with:
          name: model-access-smoke
          path: |
            ChatAlchemy/backend/benchmark/openai-access-probe.json
            ChatAlchemy/backend/benchmark/model-credential-smoke.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if no candidate model is accessible
        if: ${{ steps.credential.outputs.available == 'true' && steps.access.outcome != 'success' }}
        run: exit 1
