name: ChatAlchemy Targeted Component Diagnostics

on:
  push:
    branches:
      - diagnostics/ieee-component-2026-08-21
  pull_request:
    branches:
      - main
    paths:
      - 'ChatAlchemy/backend/scripts/run_targeted_component_diagnostics.py'
      - '.github/workflows/chatalchemy-targeted-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatalchemy-targeted-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ChatAlchemy/backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Verify failure-semantics regression tests
        run: PYTHONPATH=. pytest -q tests/test_failure_handling.py tests/test_fault_injection.py

      - name: Run deterministic targeted component diagnostics
        run: >-
          PYTHONPATH=. python scripts/run_targeted_component_diagnostics.py
          --join-cases 200
          --seed 1729
          --out benchmark/targeted-component-diagnostics.json

      - name: Run live RxNorm alias normalization diagnostic
        run: >-
          PYTHONPATH=. python scripts/evaluate_entity_normalization.py
          --split all
          --out benchmark/entity-normalization-live.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ieee-targeted-component-diagnostics
          path: |
            ChatAlchemy/backend/benchmark/targeted-component-diagnostics.json
            ChatAlchemy/backend/benchmark/entity-normalization-live.json
          if-no-files-found: warn
          retention-days: 90
