name: ChatAlchemy research CI

on:
  pull_request:
    paths:
      - 'ChatAlchemy/**'
      - '.github/workflows/chatalchemy-research-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ChatAlchemy/**'
      - '.github/workflows/chatalchemy-research-ci.yml'
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/generate_livebiobench.py --n 1500 --seed 1729 --out benchmark/livebiobench-ci.json
      - run: python - <<'PY'
        import json
        data=json.load(open('benchmark/livebiobench-ci.json'))
        assert len(data)==1500
        assert len({x['id'] for x in data})==1500
        print('LiveBioEvidenceBench generation passed')
        PY

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAlchemy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_live_benchmark.py --n 8 --seed 1729 --out benchmark/live-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: chatalchemy-live-smoke
          path: ChatAlchemy/backend/benchmark/live-smoke.json
